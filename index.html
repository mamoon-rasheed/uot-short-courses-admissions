<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Course Admission - University of Turbat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">

    <header class="bg-blue-900 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold uppercase tracking-wider">University of Turbat</h1>
            <p class="text-blue-200 mt-2 text-sm">Short Course Admission Form</p>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <form id="admissionForm" class="bg-white shadow-xl rounded-lg p-8 space-y-6">

            <div class="border-b pb-4">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fas fa-camera mr-2 text-blue-600"></i> Applicant Photo
                </h2>
                <div class="flex items-center space-x-6">
                    <div class="shrink-0">
                        <img id="preview" class="h-24 w-24 object-cover rounded-full border-2 border-gray-200"
                            src="https://via.placeholder.com/150" alt="Current profile photo" />
                    </div>
                    <label class="block">
                        <span class="sr-only">Choose profile photo</span>
                        <input type="file" id="applicantPhoto" required accept="image/*" class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        file:hover:bg-blue-100
                        " />
                        <p class="mt-1 text-xs text-gray-500">Recent Passport size photograph (Max 2MB)</p>
                    </label>
                </div>
            </div>

            <div class="border-b pb-4">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fas fa-user-graduate mr-2 text-blue-600"></i> Personal Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="FullName" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Father's Name</label>
                        <input type="text" id="FatherName" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                        <input type="date" id="DOB" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">CNIC / B-Form</label>
                        <input type="text" id="CNIC" pattern="\d{5}-\d{7}-\d{1}" placeholder="00000-0000000-0" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contact No</label>
                        <input type="tel" id="Contact" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="Email" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Postal Address</label>
                    <textarea id="PostalAddress" rows="2" required
                        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Permanent Address</label>
                    <textarea id="PermanentAddress" rows="2" required
                        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
            </div>

            <div class="border-b pb-4">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fas fa-book mr-2 text-blue-600"></i> Qualification Details
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Degree</label>
                        <input type="text" id="Degree"
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                        <input type="text" id="Subject"
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Year</label>
                        <input type="number" id="Year"
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Marks/Grade</label>
                        <input type="text" id="Marks"
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Institute</label>
                        <input type="text" id="Institute"
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <div class="border-b pb-4">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fas fa-laptop-code mr-2 text-blue-600"></i> Course Selection
                </h2>
                <select id="SelectedCourse" required
                    class="w-full p-3 border border-gray-300 rounded bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="" disabled selected>-- Select a Course --</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Database Administration">Database Administration</option>
                    <option value="DevOps & Server Admin">DevOps & Server Admin</option>
                    <option value="Mobile App Development">Mobile App Development</option>
                    <option value="AI Automation">AI Automation</option>
                    <option value="Networking Professional">Networking Professional</option>
                    <option value="Computer Hardware">Computer Hardware</option>
                    <option value="Graphic Design">Graphic Design</option>
                    <option value="Office Automation">Office Automation</option>
                    <option value="Professional Typing">Professional Typing</option>
                    <option value="DIT (Diploma)">DIT (Diploma)</option>
                    <option value="Stenotypist / Stenographer">Stenotypist / Stenographer</option>
                </select>
            </div>

            <div class="pt-4">
                <button type="submit" id="btnSubmit"
                    class="w-full bg-blue-900 text-white font-bold py-3 px-4 rounded hover:bg-blue-800 transition duration-300 flex justify-center items-center">
                    <span>Submit Application</span>
                </button>
            </div>
        </form>

        <div id="successMessage"
            class="hidden mt-6 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative text-center">
            <strong class="font-bold">Success!</strong>
            <span class="block sm:inline">Your admission form and photo have been submitted.</span>
            <button onclick="location.reload()" class="mt-2 text-sm underline">Submit another</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwRu-bytRBEgaSNInne8nZKCAGfqsxcF3xHFG8-3Y4ZppJO6ePu6ICCwSbgt3HNdpJY/exec';

        // Preview Image on selection
        document.getElementById('applicantPhoto').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) { document.getElementById('preview').src = e.target.result; }
                reader.readAsDataURL(file);
            }
        });

        const form = document.getElementById('admissionForm');
        const btn = document.getElementById('btnSubmit');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;

            // 1. Gather Text Data manually to match JSON structure
            const textData = {
                "Full Name": document.getElementById('FullName').value,
                "Father Name": document.getElementById('FatherName').value,
                "DOB": document.getElementById('DOB').value,
                "CNIC": document.getElementById('CNIC').value,
                "Contact": document.getElementById('Contact').value,
                "Email": document.getElementById('Email').value,
                "Postal Address": document.getElementById('PostalAddress').value,
                "Permanent Address": document.getElementById('PermanentAddress').value,
                "Degree": document.getElementById('Degree').value,
                "Subject": document.getElementById('Subject').value,
                "Year": document.getElementById('Year').value,
                "Marks": document.getElementById('Marks').value,
                "Institute": document.getElementById('Institute').value,
                "Selected Course": document.getElementById('SelectedCourse').value
            };

            // 2. Process File
            const fileInput = document.getElementById('applicantPhoto');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();

                // Read file as Base64
                reader.readAsDataURL(file);
                reader.onload = function () {
                    const rawBase64 = reader.result.split(',')[1]; // Remove "data:image/png;base64," part

                    // Combine Text + File Data
                    const payload = {
                        ...textData,
                        fileData: rawBase64,
                        fileName: file.name,
                        mimeType: file.type
                    };

                    sendData(payload);
                };
            } else {
                // Submit without file (if needed, though file is required in HTML)
                sendData(textData);
            }
        });

        function sendData(payload) {
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Important for GAS Web Apps
                body: JSON.stringify(payload),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
                .then(response => {
                    // Because 'no-cors' returns an opaque response, we assume success if no error.
                    document.getElementById('successMessage').classList.remove('hidden');
                    form.classList.add('hidden');
                    btn.innerHTML = 'Submitted';
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    btn.innerHTML = 'Error! Try Again';
                    btn.disabled = false;
                });
        }
    </script>
</body>

</html>
