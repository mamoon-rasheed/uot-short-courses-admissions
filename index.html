<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Course Admission - University of Turbat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">

    <header class="bg-blue-900 text-white py-6 shadow-md">
        <div
            class="container mx-auto px-4 flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-6">
            <img src="https://uot.edu.pk/img/uotlogo.png" alt="University of Turbat Logo"
                class="h-20 w-auto rounded-full p-1">

            <div class="text-center md:text-left">
                <h1 class="text-2xl md:text-3xl font-bold uppercase tracking-wider">University of Turbat</h1>
                <p class="text-blue-200 mt-1 text-sm font-medium tracking-wide">Short Course Admission Form</p>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <form id="admissionForm" class="bg-white shadow-xl rounded-lg p-8 space-y-6">

            <div class="border-b pb-4">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fas fa-camera mr-2 text-blue-600"></i> Applicant Photo
                </h2>
                <div class="flex items-center space-x-6">
                    <div class="shrink-0">
                        <img id="preview" class="h-24 w-24 object-cover rounded-full border-2 border-gray-200"
                            src="https://placehold.co/150x150?text=Student\nImage" alt="Current profile photo" />
                    </div>
                    <label class="block">
                        <span class="sr-only">Choose profile photo</span>
                        <input type="file" id="applicantPhoto" required accept="image/*" class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        file:hover:bg-blue-100
                        " />
                        <p class="mt-1 text-xs text-gray-500">Recent Passport size photograph (Max 2MB)</p>
                    </label>
                </div>
            </div>

            <div class="border-b pb-4">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fas fa-user-graduate mr-2 text-blue-600"></i> Personal Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="FullName" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Father's Name</label>
                        <input type="text" id="FatherName" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                        <input type="date" id="DOB" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">CNIC / B-Form
                            (12345-6789101-2)</label>
                        <input type="text" id="CNIC" pattern="\d{5}-\d{7}-\d{1}" placeholder="00000-0000000-0" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contact No</label>
                        <input type="tel" id="Contact" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="Email" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Postal Address</label>
                    <textarea id="PostalAddress" rows="2" required
                        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Permanent Address</label>
                    <textarea id="PermanentAddress" rows="2" required
                        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
            </div>

            <div class="border-b pb-4">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fas fa-book mr-2 text-blue-600"></i> Qualification Details
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Degree</label>
                        <input type="text" id="Degree" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                        <input type="text" id="Subject" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Year</label>
                        <input type="number" id="Year" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Marks/Grade</label>
                        <input type="text" id="Marks" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Institute</label>
                        <input type="text" id="Institute" required
                            class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <div class="border-b pb-4">
                <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fas fa-laptop-code mr-2 text-blue-600"></i> Course Selection
                </h2>
                <select id="SelectedCourse" required
                    class="w-full p-3 border border-gray-300 rounded bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="" disabled selected>-- Select a Course --</option>
                    <option value="AI Automation">AI Automation</option>
                    <option value="MS Office Certification">MS Office Certification</option>
                    <option value="DIT (Diploma)">DiT (Diploma in IT)</option>
                    <option value="Professional Typing">Professional Typing</option>
                    <option value="IT Education for School Children">IT Education for School Children</option>
                </select>
            </div>

            <div class="pt-4">
                <button type="submit" id="btnSubmit"
                    class="w-full bg-blue-900 text-white font-bold py-3 px-4 rounded hover:bg-blue-800 transition duration-300 flex justify-center items-center">
                    <span>Submit Application</span>
                </button>
            </div>
        </form>

        <div id="successMessage" class="hidden mt-6 border px-4 py-4 rounded relative text-center">
            <strong id="resultTitle" class="font-bold">Success!</strong>
            <span id="resultText" class="block sm:inline">Your admission form and photo have been submitted.</span>
            <div class="mt-4 flex flex-col sm:flex-row justify-center gap-3">
                <button type="button" id="btnDownloadPdf"
                    class="bg-blue-900 text-white font-semibold py-2 px-4 rounded hover:bg-blue-800 transition duration-300">
                    <i class="fas fa-file-pdf mr-2"></i>Download PDF
                </button>
                <button type="button" onclick="location.reload()" class="text-sm underline">Submit another</button>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbysPw0WEUO-vcmxe1exenLPZhM24GpKVYnyLV5ojDNgHJ3EXQb6ePZzb9qeEokxkKJw/exec';

        // Preview Image on selection
        document.getElementById('applicantPhoto').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) { document.getElementById('preview').src = e.target.result; }
                reader.readAsDataURL(file);
            }
        });

        const form = document.getElementById('admissionForm');
        const btn = document.getElementById('btnSubmit');
        const resultBox = document.getElementById('successMessage');
        const resultTitle = document.getElementById('resultTitle');
        const resultText = document.getElementById('resultText');
        const downloadPdfButton = document.getElementById('btnDownloadPdf');
        let lastPdfData = null;

        form.addEventListener('submit', async e => {
            e.preventDefault();
            setSubmitState('Checking application...', true);

            // 1. Gather Text Data manually to match JSON structure
            const textData = {
                "Full Name": cleanInputValue('FullName'),
                "Father Name": cleanInputValue('FatherName'),
                "DOB": cleanInputValue('DOB'),
                "CNIC": cleanInputValue('CNIC'),
                "Contact": cleanInputValue('Contact'),
                "Email": cleanInputValue('Email'),
                "Postal Address": cleanInputValue('PostalAddress'),
                "Permanent Address": cleanInputValue('PermanentAddress'),
                "Degree": cleanInputValue('Degree'),
                "Subject": cleanInputValue('Subject'),
                "Year": cleanInputValue('Year'),
                "Marks": cleanInputValue('Marks'),
                "Institute": cleanInputValue('Institute'),
                "Selected Course": cleanInputValue('SelectedCourse')
            };

            try {
                const fileInput = document.getElementById('applicantPhoto');
                const file = fileInput.files[0];
                const photoDataUrl = file ? await readFileAsDataURL(file) : '';

                setSubmitState('Submitting application...', true);

                const payload = {
                    ...textData
                };

                if (file && photoDataUrl) {
                    payload.fileData = photoDataUrl.split(',')[1];
                    payload.fileName = file.name;
                    payload.mimeType = file.type;
                }

                await sendData(payload);
                showResult('Your admission form and photo have been submitted. Your admission PDF has been generated for physical payment verification.', textData, photoDataUrl);
            } catch (error) {
                console.error('Error!', error.message);
                btn.innerHTML = 'Error! Try Again';
                btn.disabled = false;
            }
        });

        downloadPdfButton.addEventListener('click', function () {
            if (lastPdfData) {
                downloadAdmissionPdf(lastPdfData.textData, lastPdfData.photoDataUrl);
            }
        });

        function setSubmitState(label, disabled) {
            btn.innerHTML = disabled ? '<div class="spinner mr-2"></div><span>' + label + '</span>' : '<span>' + label + '</span>';
            btn.disabled = disabled;
        }

        function cleanInputValue(id) {
            return document.getElementById(id).value.trim();
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Unable to read the selected photo.'));
                reader.readAsDataURL(file);
            });
        }

        function sendData(payload) {
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Important for GAS Web Apps
                body: JSON.stringify(payload),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
                .then(response => {
                    // Because 'no-cors' returns an opaque response, we assume success if no error.
                    document.getElementById('successMessage').classList.remove('hidden');
                    form.classList.add('hidden');
                    btn.innerHTML = 'Submitted';
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    btn.innerHTML = 'Error! Try Again';
                    btn.disabled = false;
                });
        }

        function showResult(message, textData, photoDataUrl) {
            lastPdfData = { textData, photoDataUrl };

            resultBox.classList.remove('hidden', 'bg-green-100', 'border-green-400', 'text-green-700');
            resultBox.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
            resultTitle.textContent = 'Success!';
            resultText.textContent = message;
            form.classList.add('hidden');
            btn.innerHTML = 'Submitted';
        }

        function downloadAdmissionPdf(textData, photoDataUrl) {
            if (!window.jspdf || !window.jspdf.jsPDF) {
                alert('The PDF generator is still loading. Please try the download button again in a moment.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'a4' });

            drawAdmissionCopy(doc, textData, photoDataUrl, 'Applicant Copy');
            doc.addPage();
            drawAdmissionCopy(doc, textData, photoDataUrl, 'Office Copy');

            doc.save(buildPdfFileName(textData));
        }

        function drawAdmissionCopy(doc, data, photoDataUrl, copyLabel) {
            const pageWidth = doc.internal.pageSize.getWidth();
            const margin = 42;
            let y = 42;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(18);
            doc.text('University of Turbat', pageWidth / 2, y, { align: 'center' });

            y += 22;
            doc.setFontSize(13);
            doc.text('Short Course Admission Form', pageWidth / 2, y, { align: 'center' });

            y += 20;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.text(copyLabel, pageWidth - margin, y, { align: 'right' });

            y += 16;
            doc.setDrawColor(30, 64, 175);
            doc.setLineWidth(1);
            doc.line(margin, y, pageWidth - margin, y);
            y += 18;

            if (photoDataUrl) {
                try {
                    doc.addImage(photoDataUrl, 'JPEG', pageWidth - margin - 78, y, 78, 78);
                } catch (error) {
                    try {
                        doc.addImage(photoDataUrl, 'PNG', pageWidth - margin - 78, y, 78, 78);
                    } catch (imageError) {
                        console.warn('Photo could not be added to PDF.', imageError);
                    }
                }
            }

            doc.setFontSize(10);
            y = drawSectionTitle(doc, 'Applicant Information', margin, y);
            y = drawTwoColumnRows(doc, [
                ['Full Name', data['Full Name']],
                ['Father Name', data['Father Name']],
                ['Date of Birth', data['DOB']],
                ['CNIC / B-Form', data['CNIC']],
                ['Contact No', data['Contact']],
                ['Email Address', data['Email']]
            ], margin, y, pageWidth - (margin * 2) - 96);

            y = drawFullRow(doc, 'Postal Address', data['Postal Address'], margin, y, pageWidth - (margin * 2));
            y = drawFullRow(doc, 'Permanent Address', data['Permanent Address'], margin, y, pageWidth - (margin * 2));

            y += 8;
            y = drawSectionTitle(doc, 'Qualification Details', margin, y);
            y = drawTwoColumnRows(doc, [
                ['Degree', data['Degree']],
                ['Subject', data['Subject']],
                ['Year', data['Year']],
                ['Marks / Grade', data['Marks']],
                ['Institute', data['Institute']],
                ['Selected Course', data['Selected Course']]
            ], margin, y, pageWidth - (margin * 2));

            y += 10;
            y = drawSectionTitle(doc, 'Office Use Only - Physical Payment Verification', margin, y);
            y = drawOfficeUseSection(doc, margin, y, pageWidth - (margin * 2));

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(90);
            doc.text('This form is generated for admission record and physical payment verification.', margin, doc.internal.pageSize.getHeight() - 28);
            doc.setTextColor(0);
        }

        function drawSectionTitle(doc, title, x, y) {
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setFillColor(239, 246, 255);
            doc.setDrawColor(191, 219, 254);
            doc.rect(x, y, doc.internal.pageSize.getWidth() - (x * 2), 22, 'FD');
            doc.text(title, x + 8, y + 15);
            return y + 34;
        }

        function drawTwoColumnRows(doc, rows, x, y, width) {
            const columnGap = 18;
            const columnWidth = (width - columnGap) / 2;

            for (let i = 0; i < rows.length; i += 2) {
                const left = rows[i];
                const right = rows[i + 1];
                const leftHeight = getFieldHeight(doc, left[1], columnWidth);
                const rightHeight = right ? getFieldHeight(doc, right[1], columnWidth) : 0;
                const rowHeight = Math.max(leftHeight, rightHeight);

                drawField(doc, left[0], left[1], x, y, columnWidth, rowHeight);
                if (right) {
                    drawField(doc, right[0], right[1], x + columnWidth + columnGap, y, columnWidth, rowHeight);
                }
                y += rowHeight + 10;
            }

            return y;
        }

        function drawFullRow(doc, label, value, x, y, width) {
            const height = getFieldHeight(doc, value, width);
            drawField(doc, label, value, x, y, width, height);
            return y + height + 10;
        }

        function getFieldHeight(doc, value, width) {
            const textWidth = Math.max(60, width - 10);
            const lines = doc.splitTextToSize(String(value || ' '), textWidth);
            return Math.max(34, 16 + (lines.length * 11));
        }

        function drawField(doc, label, value, x, y, width, height) {
            doc.setDrawColor(220);
            doc.setLineWidth(0.5);
            doc.rect(x, y, width, height);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8);
            doc.setTextColor(75);
            doc.text(label, x + 5, y + 10);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.setTextColor(0);
            const lines = doc.splitTextToSize(String(value || ' '), width - 10);
            doc.text(lines, x + 5, y + 24);
        }

        function drawOfficeUseSection(doc, x, y, width) {
            const lineGap = 38;
            const leftLabelX = x + 8;
            const lineStartX = x + 162;
            const lineEndX = x + width - 8;
            const fields = ['Payment Amount', 'Received By Staff Name', 'Staff Signature'];

            doc.setDrawColor(120);
            doc.rect(x, y, width, 136);
            y += 26;

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);

            fields.forEach((field) => {
                doc.text(field + ':', leftLabelX, y);
                doc.line(lineStartX, y + 2, lineEndX, y + 2);
                y += lineGap;
            });

            return y + 10;
        }

        function buildPdfFileName(data) {
            const name = [data['Full Name'], data['Selected Course']]
                .join('-')
                .replace(/[^a-z0-9]+/gi, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '')
                .toLowerCase();

            return (name || 'admission-form') + '.pdf';
        }
    </script>
</body>

</html>
